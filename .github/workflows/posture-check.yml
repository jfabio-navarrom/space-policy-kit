name: posture-check

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Conftest
        run: |
          VERSION=0.70.1
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/

      - name: Evaluate mission posture
        run: |
          conftest test missions/vulpine-earth-remediated.yaml --output json > result.json || true
          echo "--- conftest result ---"
          cat result.json

      - name: Publish control status
        run: |
          test -s policy/controls.txt || { echo "::error::policy/controls.txt is missing or empty"; exit 1; }

          FAILED=$(jq -r '[.[] | .failures[]?.msg] | join(" ")' result.json)
          ROWS=0

          {
            echo "## Control status — Vulpine-Earth"
            echo ""
            echo "Evaluated on $(date -u '+%d %B %Y at %H:%M UTC')"
            echo ""
            echo "| Control | Name | Status |"
            echo "| --- | --- | --- |"
            while IFS='|' read -r id name || [ -n "$id" ]; do
              [ -z "$id" ] && continue
              ROWS=$((ROWS+1))
              if echo "$FAILED" | grep -q "$id"; then
                echo "| \`$id\` | $name | **FAIL** |"
              else
                echo "| \`$id\` | $name | pass |"
              fi
            done < policy/controls.txt
            echo ""
            if [ -n "$FAILED" ]; then
              echo "### Findings"
              echo ""
              jq -r '.[] | .failures[]?.msg | "- " + .' result.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "rows written: $ROWS"
          COUNT=$(jq '[.[] | .failures[]?] | length' result.json)
          echo "findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then exit 1; fi
